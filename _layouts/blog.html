---
layout: compress
---

{% include head.html %}

<main>

    {% include header.html %}

    {{ content }}

    {% include post-list.html posts=site.posts %}

    <small>

        {% for tag in site.tags %}

        {% assign tag_slug = tag | first %}
        {% assign no_of_posts = tag | last | size %}

        <a href="{{ 'tagged/' | relative_url }}{{ tag_slug }}" title="See all posts by {{ tag_slug }} tag">#{{ tag_slug
            }}</a>
        {% endfor %}
    </small>

</main>

{% include footer.html %}

</body>

</html>
